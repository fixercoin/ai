<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image & Video Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        h1 {
            color: #fff;
            font-size: 2rem;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #12121f;
            padding: 0.25rem;
            border-radius: 0.75rem;
        }
        .tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .tab.active {
            background: #6366f1;
            color: #fff;
        }
        .tab:hover:not(.active) { color: #e2e8f0; }
        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid #2d2d44;
            background: #12121f;
            color: #f1f5f9;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #6366f1; }
        .hint { color: #64748b; font-size: 0.85rem; margin: 0.5rem 0 1rem; }
        button {
            background: #6366f1;
            color: #fff;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            background: #4f46e5;
            transform: translateY(-1px);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loader {
            display: none;
            margin: 2rem auto;
            width: 48px;
            height: 48px;
            border: 3px solid #2d2d44;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            margin-top: 2rem;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result img, .result video {
            max-width: 100%;
            max-height: 450px;
            border-radius: 0.75rem;
            border: 1px solid #2d2d44;
            background: #0a0a1a;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .result .placeholder { color: #475569; font-size: 0.95rem; }
        .error {
            color: #f87171;
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(248,113,113,0.1);
            border-radius: 0.5rem;
            border: 1px solid rgba(248,113,113,0.2);
            display: none;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
        }
        .badge {
            display: inline-block;
            background: rgba(99,102,241,0.15);
            color: #818cf8;
            padding: 0.2rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }
        .history {
            margin-top: 2rem;
            border-top: 1px solid #2d2d44;
            padding-top: 1rem;
        }
        .history h3 { color: #94a3b8; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .history-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem;
            background: #12121f;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-item:hover { background: #1a1a2e; }
        .history-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 0.25rem;
            background: #0a0a1a;
        }
        .history-item .info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .history-item .prompt-text {
            color: #e2e8f0;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 300px;
        }
        .history-item .date {
            color: #64748b;
            font-size: 0.75rem;
        }
        .history-item .type-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 1rem;
            background: rgba(99,102,241,0.2);
            color: #818cf8;
        }
        .no-history {
            color: #475569;
            text-align: center;
            padding: 1rem;
        }
        .image-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .image-container img {
            display: block;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ AI Creator</h1>
        <p class="subtitle">Generate images & videos from text — free, no watermark</p>

        <div class="tabs">
            <button class="tab active" data-mode="image" onclick="setMode('image')">🖼️ Image</button>
            <button class="tab" data-mode="video" onclick="setMode('video')">🎬 Video (1 min)</button>
        </div>

        <textarea id="prompt" placeholder="Describe what you want to create...">A futuristic city with neon lights and flying cars</textarea>
        <p class="hint" id="hintText">💡 Be detailed for better results</p>

        <button id="generateBtn" onclick="generate()">🚀 Generate</button>
        <div class="loader" id="loader"></div>
        <div class="result" id="result">
            <span class="placeholder">✨ Your creation will appear here</span>
        </div>
        <div class="error" id="error"></div>

        <div class="history" id="historySection" style="display:none;">
            <h3>📜 History (Stored in KV)</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        let currentMode = 'image';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.mode === mode);
            });
            document.getElementById('hintText').textContent = mode === 'image' ?
                '💡 Be detailed for better images. Example: "A cyberpunk city at night, neon lights, rain"' :
                '🎬 Describe a scene for video. Example: "A cat drinking tea in a cozy kitchen, cinematic"';
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value.trim();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!prompt) {
                errorDiv.textContent = '⚠️ Please enter a prompt';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            loader.style.display = 'block';
            resultDiv.innerHTML = '<span class="placeholder">⏳ Generating... please wait up to 30 seconds</span>';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, mode: currentMode })
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Server returned ${response.status}: ${text.substring(0, 100)}...`);
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Something went wrong');
                }

                console.log('Response data:', data);
                console.log('Image URL type:', typeof data.url);
                console.log('Image URL starts with:', data.url ? data.url.substring(0, 50) : 'null');

                // Ensure the URL is valid
                let imageUrl = data.url;
                
                // Fix the URL if it's missing the data URL prefix
                if (typeof imageUrl === 'string') {
                    // If it starts with /9j/ (raw base64 JPEG)
                    if (imageUrl.startsWith('/9j/')) {
                        imageUrl = `data:image/jpeg;base64,${imageUrl}`;
                        console.log('Fixed missing data URL prefix');
                    }
                    // If it's just a raw base64 string without prefix
                    else if (imageUrl.match(/^[A-Za-z0-9+/=]+$/) && imageUrl.length > 100) {
                        imageUrl = `data:image/jpeg;base64,${imageUrl}`;
                        console.log('Added data URL prefix to raw base64');
                    }
                }

                // Display the result
                if (data.type === 'image' && imageUrl) {
                    resultDiv.innerHTML = `
                        <div class="image-container">
                            <img src="${imageUrl}" alt="Generated image" 
                                 onload="console.log('Image loaded successfully')"
                                 onerror="this.onerror=null; this.alt='Image load failed'; this.style.border='2px solid #f87171'; console.error('Image failed to load');" />
                            <span class="badge">✨ Image generated (ID: ${data.id || 'N/A'})</span>
                        </div>
                    `;
                } else if (data.type === 'video' && imageUrl) {
                    resultDiv.innerHTML = `
                        <video controls autoplay loop>
                            <source src="${imageUrl}" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                        <span class="badge">🎬 Video generated (ID: ${data.id || 'N/A'})</span>
                    `;
                } else {
                    throw new Error('No image URL returned from server');
                }

                // Load history after generation
                await loadHistory();

            } catch (err) {
                console.error('Generation error:', err);
                errorDiv.textContent = '❌ ' + err.message;
                errorDiv.style.display = 'block';
                resultDiv.innerHTML = '<span class="placeholder">❌ Generation failed. Please try again.</span>';
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        // Load history from KV via API
        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    console.warn('History endpoint returned non-JSON response');
                    const historySection = document.getElementById('historySection');
                    historySection.style.display = 'block';
                    document.getElementById('historyList').innerHTML = '<div class="no-history">⚠️ History endpoint not available. Your images are still being generated!</div>';
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load history');
                }

                const historySection = document.getElementById('historySection');
                const historyList = document.getElementById('historyList');

                if (data.items && data.items.length > 0) {
                    historySection.style.display = 'block';
                    historyList.innerHTML = data.items.map(item => {
                        let itemUrl = item.url;
                        // Fix URL if needed
                        if (typeof itemUrl === 'string' && itemUrl.startsWith('/9j/')) {
                            itemUrl = `data:image/jpeg;base64,${itemUrl}`;
                        }
                        return `
                        <div class="history-item" onclick="viewHistoryItem('${item.id}')">
                            <img src="${itemUrl}" alt="Generated item" 
                                 onerror="this.style.display='none'; this.parentElement.querySelector('.img-error').style.display='block';" />
                            <span class="img-error" style="display:none;color:#64748b;font-size:0.7rem;width:50px;text-align:center;">No img</span>
                            <div class="info">
                                <span class="prompt-text">${item.prompt ? item.prompt.substring(0, 60) : 'No prompt'}${item.prompt && item.prompt.length > 60 ? '...' : ''}</span>
                                <span class="date">${item.created ? new Date(item.created).toLocaleString() : 'Unknown date'}</span>
                            </div>
                            <span class="type-badge">${item.type || 'image'}</span>
                        </div>
                    `}).join('');
                } else {
                    historySection.style.display = 'block';
                    historyList.innerHTML = '<div class="no-history">No history yet. Generate something!</div>';
                }
            } catch (err) {
                console.error('History load error:', err);
                const historySection = document.getElementById('historySection');
                historySection.style.display = 'block';
                document.getElementById('historyList').innerHTML = '<div class="no-history">⚠️ Could not load history. Your images are still working!</div>';
            }
        }

        async function viewHistoryItem(id) {
            try {
                const response = await fetch(`/api/history/${id}`);
                const data = await response.json();
                const resultDiv = document.getElementById('result');
                
                let imageUrl = data.url;
                if (typeof imageUrl === 'string' && imageUrl.startsWith('/9j/')) {
                    imageUrl = `data:image/jpeg;base64,${imageUrl}`;
                }
                
                if (data.type === 'image') {
                    resultDiv.innerHTML = `
                        <img src="${imageUrl}" alt="Generated image" 
                             onerror="this.alt='Image load failed'; this.style.border='2px solid #f87171';" />
                        <span class="badge">📜 History item: ${data.id}</span>
                    `;
                } else if (data.type === 'video') {
                    resultDiv.innerHTML = `
                        <video controls autoplay>
                            <source src="${imageUrl}" type="video/mp4">
                            Your browser does not support video playback.
                        </video>
                        <span class="badge">📜 History item: ${data.id}</span>
                    `;
                }
            } catch (err) {
                document.getElementById('error').textContent = '❌ Could not load item';
                document.getElementById('error').style.display = 'block';
            }
        }

        // Load history on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory().catch(() => {
                // Silently fail - history is non-critical
            });
        });
    </script>
</body>
</html>
