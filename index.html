<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIXORIUM AI - FREE IMAGE & VIDEO GENERATOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        /* HEADER - LOGO LEFT, TEXT RIGHT */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0 1.5rem 0;
            border-bottom: 1px solid #f3f4f6;
            margin-bottom: 1.5rem;
            flex-wrap: nowrap;
            gap: 0.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .header-left .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-left .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .header-right {
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #f3f4f6;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: center;
            min-width: fit-content;
        }

        /* INPUT AREA - NO CARD */
        .input-area {
            background: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* TOP ROW: TEXT FIELD + GENERATE BUTTON */
        .input-top {
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
            background: transparent;
            padding: 0;
            position: relative;
        }

        /* TEXT FIELD - WITH + BUTTON INSIDE */
        .input-top .text-field-wrapper {
            flex: 1;
            position: relative;
        }

        .input-top .text-field {
            width: 100%;
            padding: 1.5rem 3.5rem 1.5rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            min-height: 160px;
            max-height: 400px;
            background: transparent;
            color: #1f2937;
            line-height: 1.8;
            text-transform: uppercase;
            overflow-y: auto;
            border: 2px dashed #d1d5db;
            border-radius: 0.375rem;
            outline: none;
            transition: all 0.2s;
            resize: none;
        }

        .input-top .text-field::placeholder {
            color: #9ca3af;
            text-transform: none;
        }

        .input-top .text-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .input-top .text-field:focus {
            text-transform: uppercase;
        }

        /* + BUTTON INSIDE TEXT FIELD - BOTTOM RIGHT */
        .input-top .add-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px dashed #d1d5db;
            background: transparent;
            color: #6b7280;
            font-size: 1.2rem;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            z-index: 10;
        }

        .input-top .add-btn:hover {
            border-color: #6366f1;
            color: #6366f1;
            background: #f5f3ff;
        }

        /* DROPDOWN MENU */
        .input-top .dropdown-menu {
            display: none;
            position: absolute;
            bottom: 50px;
            right: 12px;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 0.375rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            min-width: 140px;
            z-index: 20;
            overflow: hidden;
        }

        .input-top .dropdown-menu.active {
            display: block;
        }

        .input-top .dropdown-menu .dropdown-item {
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f2937;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-top .dropdown-menu .dropdown-item:last-child {
            border-bottom: none;
        }

        .input-top .dropdown-menu .dropdown-item:hover {
            background: #f5f3ff;
            color: #6366f1;
        }

        .input-top .dropdown-menu .dropdown-item .icon {
            font-size: 1rem;
        }

        .input-top .generate-btn {
            padding: 0.6rem 1.8rem;
            border: none;
            border-radius: 0.375rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            height: 56px;
            align-self: center;
            min-width: 120px;
        }

        .input-top .generate-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .input-top .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* RECORDING INDICATOR */
        .recording-indicator {
            display: none;
            position: absolute;
            bottom: 55px;
            right: 12px;
            background: #ef4444;
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 1s infinite;
            z-index: 15;
        }

        .recording-indicator.active {
            display: block;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* LOADER */
        .loader {
            display: none;
            margin: 2rem auto;
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* RESULT AREA */
        .result-area {
            margin-top: 2rem;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            border-radius: 0.375rem;
            border: 2px dashed #e5e7eb;
            padding: 2rem;
            position: relative;
        }

        .result-area .placeholder {
            color: #9ca3af;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-area .placeholder .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        .result-area img,
        .result-area video {
            max-width: 100%;
            max-height: 500px;
            border-radius: 0.375rem;
            background: #f3f4f6;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* ACTION BAR */
        .action-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-bar .action-btn {
            padding: 0.4rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            background: #ffffff;
            color: #4b5563;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            height: 36px;
        }

        .action-bar .action-btn:hover {
            border-color: #6366f1;
            color: #6366f1;
            background: #f5f3ff;
        }

        .action-bar .action-btn.primary {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }

        .action-bar .action-btn.primary:hover {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        /* ERROR */
        .error {
            color: #ef4444;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #fef2f2;
            border-radius: 0.375rem;
            border: 1px solid #fecaca;
            display: none;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 0.375rem;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: -2.5rem;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .modal-close:hover {
            opacity: 1;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                flex-wrap: nowrap;
                gap: 0.4rem;
            }

            .header-left .brand-name {
                font-size: 1.1rem;
            }

            .header-left .logo {
                width: 32px;
                height: 32px;
            }

            .header-right {
                font-size: 0.55rem;
                padding: 0.3rem 0.6rem;
                letter-spacing: 0.3px;
            }

            .input-top .generate-btn {
                min-width: 100px;
                font-size: 0.75rem;
                padding: 0.5rem 1.2rem;
                height: 48px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 1rem 0.75rem;
            }

            .header {
                padding: 0.25rem 0 1rem 0;
                gap: 0.3rem;
            }

            .header-left {
                gap: 0.4rem;
            }

            .header-left .brand-name {
                font-size: 0.9rem;
                letter-spacing: 0.5px;
            }

            .header-left .logo {
                width: 28px;
                height: 28px;
            }

            .header-right {
                font-size: 0.45rem;
                padding: 0.25rem 0.5rem;
                letter-spacing: 0.2px;
                border-radius: 1.5rem;
            }

            .input-top {
                flex-wrap: wrap;
            }

            .input-top .text-field-wrapper {
                width: 100%;
            }

            .input-top .text-field {
                min-height: 120px;
                width: 100%;
                font-size: 0.85rem;
                padding: 1rem 3rem 1rem 0.8rem;
            }

            .input-top .add-btn {
                bottom: 10px;
                right: 10px;
                width: 28px;
                height: 28px;
                font-size: 1rem;
            }

            .input-top .dropdown-menu {
                bottom: 45px;
                right: 10px;
                min-width: 120px;
            }

            .input-top .generate-btn {
                width: 100%;
                padding: 0.6rem;
                text-align: center;
                font-size: 0.8rem;
                border-radius: 0.375rem;
                height: 44px;
                align-self: stretch;
                min-width: unset;
            }

            .action-bar .action-btn {
                padding: 0.35rem 0.7rem;
                font-size: 0.65rem;
                border-radius: 0.375rem;
                height: 32px;
            }

            .result-area {
                min-height: 200px;
                padding: 1rem;
                border-radius: 0.375rem;
            }
        }

        @media (max-width: 480px) {
            .header-left .brand-name {
                font-size: 0.75rem;
                letter-spacing: 0.3px;
            }

            .header-left .logo {
                width: 24px;
                height: 24px;
            }

            .header-right {
                font-size: 0.4rem;
                padding: 0.2rem 0.4rem;
                letter-spacing: 0.1px;
            }

            .input-top .text-field {
                min-height: 100px;
                font-size: 0.75rem;
                padding: 0.8rem 2.8rem 0.8rem 0.6rem;
            }

            .input-top .add-btn {
                bottom: 8px;
                right: 8px;
                width: 24px;
                height: 24px;
                font-size: 0.85rem;
            }

            .input-top .dropdown-menu {
                bottom: 40px;
                right: 8px;
                min-width: 100px;
            }

            .input-top .dropdown-menu .dropdown-item {
                font-size: 0.7rem;
                padding: 0.4rem 0.8rem;
            }
        }

        @media (max-width: 400px) {
            .header {
                gap: 0.2rem;
                padding: 0.15rem 0 0.75rem 0;
            }

            .header-left .brand-name {
                font-size: 0.65rem;
            }

            .header-left .logo {
                width: 20px;
                height: 20px;
            }

            .header-right {
                font-size: 0.35rem;
                padding: 0.15rem 0.35rem;
            }

            .input-top .text-field {
                min-height: 80px;
                font-size: 0.7rem;
                padding: 0.6rem 2.5rem 0.6rem 0.5rem;
            }

            .input-top .add-btn {
                bottom: 6px;
                right: 6px;
                width: 22px;
                height: 22px;
                font-size: 0.75rem;
            }

            .input-top .dropdown-menu {
                bottom: 35px;
                right: 6px;
                min-width: 90px;
            }

            .input-top .dropdown-menu .dropdown-item {
                font-size: 0.6rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER: LOGO LEFT, TEXT RIGHT -->
        <div class="header">
            <div class="header-left">
                <img class="logo" src="https://i.postimg.cc/Nj54ywH5/circle.png" alt="FIXORIUM AI" />
                <span class="brand-name">FIXORIUM AI</span>
            </div>
            <div class="header-right">FREE AI CLOUD SERVICE - UNLIMTED </div>
        </div>

        <!-- INPUT AREA - NO CARD -->
        <div class="input-area">
            <!-- TOP ROW: TEXT FIELD + GENERATE BUTTON -->
            <div class="input-top">
                <div class="text-field-wrapper">
                    <textarea class="text-field" id="promptInput" placeholder="DESCRIBE WHAT YOU WANT TO CREATE..." rows="1"></textarea>
                    <button class="add-btn" id="addBtn" title="ADD IMAGE / VIDEO / VOICE">+</button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" data-mode="image">
                            <span class="icon">🖼️</span> IMAGE
                        </div>
                        <div class="dropdown-item" data-mode="video">
                            <span class="icon">🎬</span> VIDEO
                        </div>
                        <div class="dropdown-item" data-mode="voice">
                            <span class="icon">🎤</span> VOICE
                        </div>
                    </div>
                    <div class="recording-indicator" id="recordingIndicator">🔴 RECORDING...</div>
                </div>
                <button class="generate-btn" id="generateBtn">GENERATE</button>
            </div>
        </div>

        <!-- LOADER -->
        <div class="loader" id="loader"></div>

        <!-- ERROR -->
        <div class="error" id="error"></div>

        <!-- RESULT AREA -->
        <div class="result-area" id="resultArea">
            <div class="placeholder">
                <span class="icon">✨</span>
                YOUR CREATION WILL APPEAR HERE
            </div>
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar" id="actionBar" style="display:none;">
            <button class="action-btn" id="previewBtn">👁️ PREVIEW</button>
            <button class="action-btn primary" id="downloadBtn">⬇️ DOWNLOAD</button>
            <button class="action-btn" id="editBtn">✏️ EDIT</button>
        </div>

        <!-- PREVIEW MODAL -->
        <div class="modal-overlay" id="previewModal">
            <div class="modal-content">
                <button class="modal-close" id="closeModal">✕</button>
                <img id="previewImage" src="" alt="PREVIEW" />
            </div>
        </div>
    </div>

    <script>
        let currentImageUrl = null;
        let currentType = 'image';
        let selectedMode = 'image';
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // DOM ELEMENTS
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('resultArea');
        const errorDiv = document.getElementById('error');
        const actionBar = document.getElementById('actionBar');
        const previewBtn = document.getElementById('previewBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const editBtn = document.getElementById('editBtn');
        const previewModal = document.getElementById('previewModal');
        const previewImage = document.getElementById('previewImage');
        const closeModal = document.getElementById('closeModal');
        const addBtn = document.getElementById('addBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const recordingIndicator = document.getElementById('recordingIndicator');

        // ============================================================
        // TOGGLE DROPDOWN
        // ============================================================
        addBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdownMenu.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function() {
            dropdownMenu.classList.remove('active');
        });

        // ============================================================
        // DROPDOWN ITEM SELECTION
        // ============================================================
        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                const mode = this.dataset.mode;
                selectedMode = mode;
                dropdownMenu.classList.remove('active');

                if (mode === 'image') {
                    // Open file picker for image
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.multiple = false;
                    input.onchange = function(e) {
                        const files = e.target.files;
                        if (files && files.length > 0) {
                            const file = files[0];
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                const img = new Image();
                                img.onload = function() {
                                    currentImageUrl = ev.target.result;
                                    currentType = 'image';
                                    resultArea.innerHTML = `
                                        <img src="${currentImageUrl}" alt="UPLOADED IMAGE" />
                                    `;
                                    actionBar.style.display = 'flex';
                                    errorDiv.style.display = 'none';
                                };
                                img.src = ev.target.result;
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    input.click();
                } else if (mode === 'video') {
                    // Open file picker for video
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'video/*';
                    input.multiple = false;
                    input.onchange = function(e) {
                        const files = e.target.files;
                        if (files && files.length > 0) {
                            const file = files[0];
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                currentImageUrl = ev.target.result;
                                currentType = 'video';
                                resultArea.innerHTML = `
                                    <video controls autoplay loop>
                                        <source src="${currentImageUrl}" type="video/mp4">
                                        YOUR BROWSER DOES NOT SUPPORT VIDEO PLAYBACK.
                                    </video>
                                `;
                                actionBar.style.display = 'flex';
                                errorDiv.style.display = 'none';
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    input.click();
                } else if (mode === 'voice') {
                    // Start voice recording
                    startVoiceRecording();
                }
            });
        });

        // ============================================================
        // VOICE RECORDING
        // ============================================================
        async function startVoiceRecording() {
            if (isRecording) {
                // Stop recording
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                isRecording = false;
                recordingIndicator.classList.remove('active');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    // Convert to text using Web Speech API
                    try {
                        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                            const recognition = new SpeechRecognition();
                            recognition.lang = 'en-US';
                            recognition.continuous = false;
                            recognition.interimResults = false;

                            recognition.onresult = function(event) {
                                const transcript = event.results[0][0].transcript;
                                promptInput.value = transcript.toUpperCase();
                                autoAdjustHeight.call(promptInput);
                                
                                // Auto-generate after voice capture
                                setTimeout(() => generate(), 500);
                            };
                            
                            recognition.onerror = function(event) {
                                console.error('Speech recognition error:', event.error);
                                errorDiv.textContent = '⚠️ COULD NOT RECOGNIZE SPEECH. PLEASE TYPE YOUR PROMPT.';
                                errorDiv.style.display = 'block';
                            };

                            recognition.start();
                            
                            // Auto-stop recognition after 5 seconds if no speech
                            setTimeout(() => {
                                try {
                                    recognition.stop();
                                } catch(e) {}
                            }, 5000);
                        } else {
                            promptInput.focus();
                        }
                    } catch (err) {
                        console.error('Voice processing error:', err);
                    }

                    // Stop all tracks
                    stream.getTracks().forEach(track => track.stop());
                    recordingIndicator.classList.remove('active');
                };

                mediaRecorder.start();
                isRecording = true;
                recordingIndicator.classList.add('active');

            } catch (err) {
                console.error('Microphone error:', err);
                errorDiv.textContent = '⚠️ MICROPHONE ACCESS DENIED. PLEASE ALLOW MICROPHONE PERMISSION.';
                errorDiv.style.display = 'block';
            }
        }

        // ============================================================
        // AUTO-ADJUST TEXTAREA HEIGHT
        // ============================================================
        function autoAdjustHeight() {
            this.style.height = 'auto';
            const newHeight = Math.min(this.scrollHeight, 400);
            this.style.height = newHeight + 'px';
        }

        promptInput.addEventListener('input', autoAdjustHeight);
        promptInput.addEventListener('focus', autoAdjustHeight);

        // ============================================================
        // ENTER KEY TO GENERATE (SHIFT+ENTER FOR NEW LINE)
        // ============================================================
        promptInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generate();
            }
        });

        // ============================================================
        // GENERATE FUNCTION
        // ============================================================
        async function generate() {
            const prompt = promptInput.value.trim();

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!prompt) {
                errorDiv.textContent = '⚠️ PLEASE ENTER A PROMPT';
                errorDiv.style.display = 'block';
                return;
            }

            generateBtn.disabled = true;
            loader.style.display = 'block';
            resultArea.innerHTML = '<div class="placeholder"><span class="icon">⏳</span>GENERATING...</div>';
            actionBar.style.display = 'none';
            currentImageUrl = null;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt,
                        mode: selectedMode
                    })
                });

                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`SERVER ERROR: ${text.substring(0, 100)}...`);
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'SOMETHING WENT WRONG');
                }

                let imageUrl = data.url;

                // FIX URL IF NEEDED
                if (typeof imageUrl === 'string') {
                    if (imageUrl.startsWith('/9j/')) {
                        imageUrl = `data:image/jpeg;base64,${imageUrl}`;
                    } else if (imageUrl.match(/^[A-Za-z0-9+/=]+$/) && imageUrl.length > 100) {
                        imageUrl = `data:image/jpeg;base64,${imageUrl}`;
                    }
                }

                currentImageUrl = imageUrl;
                currentType = data.type || 'image';

                if (currentType === 'image') {
                    resultArea.innerHTML = `
                        <img src="${currentImageUrl}" alt="GENERATED IMAGE" 
                             onerror="this.alt='IMAGE LOAD FAILED'; this.style.border='2px solid #ef4444';" />
                    `;
                } else {
                    resultArea.innerHTML = `
                        <video controls autoplay loop>
                            <source src="${currentImageUrl}" type="video/mp4">
                            YOUR BROWSER DOES NOT SUPPORT VIDEO PLAYBACK.
                        </video>
                    `;
                }

                actionBar.style.display = 'flex';
                errorDiv.style.display = 'none';

            } catch (err) {
                console.error('ERROR:', err);
                errorDiv.textContent = '❌ ' + err.message;
                errorDiv.style.display = 'block';
                resultArea.innerHTML = '<div class="placeholder"><span class="icon">❌</span>GENERATION FAILED. PLEASE TRY AGAIN.</div>';
                actionBar.style.display = 'none';
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        // GENERATE ON BUTTON CLICK
        generateBtn.addEventListener('click', generate);

        // ============================================================
        // PREVIEW
        // ============================================================
        previewBtn.addEventListener('click', function() {
            if (currentImageUrl) {
                previewImage.src = currentImageUrl;
                previewModal.classList.add('active');
            }
        });

        // CLOSE MODAL
        closeModal.addEventListener('click', function() {
            previewModal.classList.remove('active');
        });

        previewModal.addEventListener('click', function(e) {
            if (e.target === this) {
                previewModal.classList.remove('active');
            }
        });

        // ============================================================
        // DOWNLOAD
        // ============================================================
        downloadBtn.addEventListener('click', function() {
            if (currentImageUrl) {
                const link = document.createElement('a');
                link.href = currentImageUrl;
                const extension = currentType === 'image' ? 'jpg' : 'mp4';
                link.download = `FIXORIUM_${Date.now()}.${extension}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });

        // ============================================================
        // EDIT - OPENS IN NEW TAB
        // ============================================================
        editBtn.addEventListener('click', function() {
            if (currentImageUrl) {
                const win = window.open('', '_blank');
                if (win) {
                    win.document.write(`
                        <html>
                        <head><title>EDIT IMAGE - FIXORIUM AI</title></head>
                        <body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a2e;">
                            <img src="${currentImageUrl}" style="max-width:90%;max-height:90vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.5);" />
                        </body>
                        </html>
                    `);
                    win.document.close();
                }
            }
        });

        // ============================================================
        // KEYBOARD SHORTCUT: CTRL+ENTER TO GENERATE
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                generate();
            }
        });
    </script>
</body>
</html>
