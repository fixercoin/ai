<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIXORIUM AI - FREE IMAGE & VIDEO GENERATOR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1rem;
        }
        .container { max-width: 900px; width: 100%; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0 1.5rem 0;
            border-bottom: 1px solid #f3f4f6;
            margin-bottom: 1.5rem;
            flex-wrap: nowrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }
        .header-left .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: contain;
            flex-shrink: 0;
        }
        .header-left .brand-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .header-right {
            font-size: clamp(0.55rem, 1.2vw, 0.75rem);
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #f3f4f6;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: center;
            min-width: fit-content;
        }
        .input-area {
            background: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .input-top {
            display: flex;
            align-items: stretch;
            gap: 0.5rem;
            background: transparent;
            padding: 0;
            position: relative;
        }
        .input-top .text-field-wrapper {
            flex: 1;
            position: relative;
        }
        .input-top .text-field {
            width: 100%;
            padding: 2rem 3.5rem 2rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            min-height: 220px;
            max-height: 500px;
            background: transparent;
            color: #1f2937;
            line-height: 2;
            border: 2px dashed #d1d5db;
            border-radius: 0.375rem;
            outline: none;
            transition: all 0.2s;
            resize: none;
        }
        .input-top .text-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .input-top .add-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px dashed #d1d5db;
            background: transparent;
            color: #6b7280;
            font-size: 1.2rem;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            z-index: 10;
        }
        .input-top .add-btn:hover {
            border-color: #6366f1;
            color: #6366f1;
            background: #f5f3ff;
        }
        .input-top .dropdown-menu {
            display: none;
            position: absolute;
            bottom: 50px;
            right: 12px;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 0.375rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            min-width: 160px;
            z-index: 20;
            overflow: hidden;
        }
        .input-top .dropdown-menu.active { display: block; }
        .input-top .dropdown-menu .dropdown-item {
            padding: 0.6rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f2937;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .input-top .dropdown-menu .dropdown-item:last-child { border-bottom: none; }
        .input-top .dropdown-menu .dropdown-item:hover {
            background: #f5f3ff;
            color: #6366f1;
        }
        .input-top .image-preview {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 44px;
            height: 44px;
            border-radius: 0.375rem;
            border: 2px solid #e5e7eb;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 15;
        }
        .input-top .image-preview.active { display: block; }
        .input-top .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .input-top .image-preview .remove-image {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            border: none;
            font-size: 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
        }
        .input-top .image-preview .remove-image:hover { background: #dc2626; }
        .input-top .generate-btn {
            padding: 0.6rem 1.8rem;
            border: none;
            border-radius: 0.375rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            height: 56px;
            align-self: center;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-top .generate-btn .btn-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .input-top .generate-btn.loading .btn-text { display: none; }
        .input-top .generate-btn.loading .btn-loader { display: block; }
        .input-top .generate-btn.loading { pointer-events: none; }
        .input-top .generate-btn:hover:not(.loading) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99,102,241,0.35);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .recording-indicator {
            display: none;
            position: absolute;
            bottom: 55px;
            right: 12px;
            background: #ef4444;
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            animation: pulse 1s infinite;
            z-index: 15;
        }
        .recording-indicator.active { display: block; }
        .stop-recording-btn {
            display: none;
            position: absolute;
            bottom: 55px;
            right: 55px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 0.375rem;
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 16;
            box-shadow: 0 2px 8px rgba(239,68,68,0.3);
            transition: all 0.2s;
        }
        .stop-recording-btn:hover { background: #dc2626; transform: scale(1.05); }
        .stop-recording-btn.active { display: block; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .result-area {
            margin-top: 2rem;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: #fafafa;
            border-radius: 0.375rem;
            border: 2px dashed #e5e7eb;
            padding: 2rem;
            position: relative;
            max-height: 600px;
            overflow-y: auto;
        }
        .result-area .placeholder {
            color: #9ca3af;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: auto;
        }
        .result-area .placeholder .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .result-area .text-response {
            width: 100%;
            text-align: left;
            padding: 1rem;
            background: #ffffff;
            border-radius: 0.375rem;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            position: relative;
        }
        .result-area .text-response .response-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #6366f1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 0.3rem;
        }
        .result-area .result-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .result-area .result-wrapper img,
        .result-area .result-wrapper video {
            max-width: 100%;
            max-height: 450px;
            border-radius: 0.375rem;
            background: #f3f4f6;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .result-area .result-wrapper .close-result,
        .result-area .text-response .close-result {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
            z-index: 5;
        }
        .result-area .result-wrapper .close-result:hover,
        .result-area .text-response .close-result:hover {
            background: #dc2626;
            transform: scale(1.1);
        }
        .action-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-bar .action-btn {
            padding: 0.4rem 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            background: #ffffff;
            color: #4b5563;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            height: 36px;
        }
        .action-bar .action-btn:hover {
            border-color: #6366f1;
            color: #6366f1;
            background: #f5f3ff;
        }
        .action-bar .action-btn.primary {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
        }
        .action-bar .action-btn.primary:hover {
            background: #4f46e5;
            border-color: #4f46e5;
        }
        .error {
            color: #ef4444;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #fef2f2;
            border-radius: 0.375rem;
            border: 1px solid #fecaca;
            display: none;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content { max-width: 90%; max-height: 90%; position: relative; }
        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 0.375rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute;
            top: -2.5rem;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .modal-close:hover { opacity: 1; }

        @media (max-width: 640px) {
            body { padding: 1rem 0.75rem; }
            .header { flex-wrap: wrap; gap: 0.3rem; }
            .header-left .brand-name { font-size: 0.9rem; }
            .header-left .logo { width: 28px; height: 28px; }
            .header-right { font-size: 0.45rem; padding: 0.25rem 0.5rem; }
            .input-top { flex-wrap: wrap; }
            .input-top .text-field-wrapper { width: 100%; }
            .input-top .text-field { min-height: 160px; font-size: 0.85rem; padding: 1.2rem 3rem 1.2rem 0.8rem; }
            .input-top .generate-btn { width: 100%; height: 44px; font-size: 0.8rem; min-width: unset; }
            .result-area { min-height: 200px; padding: 1rem; max-height: 400px; }
            .result-area .result-wrapper .close-result,
            .result-area .text-response .close-result { width: 22px; height: 22px; font-size: 0.7rem; top: -8px; right: -8px; }
        }
        @media (max-width: 480px) {
            .header-left .brand-name { font-size: 0.75rem; }
            .header-left .logo { width: 24px; height: 24px; }
            .header-right { font-size: 0.4rem; padding: 0.2rem 0.4rem; }
            .input-top .text-field { min-height: 140px; font-size: 0.75rem; padding: 1rem 2.8rem 1rem 0.6rem; }
            .input-top .add-btn { width: 24px; height: 24px; font-size: 0.85rem; bottom: 8px; right: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <img class="logo" src="https://i.postimg.cc/Nj54ywH5/circle.png" alt="FIXORIUM AI" />
                <span class="brand-name">FIXORIUM AI</span>
            </div>
            <div class="header-right">AI CLOUD FREE SERVICE</div>
        </div>

        <div class="input-area">
            <div class="input-top">
                <div class="text-field-wrapper">
                    <textarea class="text-field" id="promptInput" placeholder="ASK ANYTHING OR DESCRIBE WHAT YOU WANT TO CREATE..." rows="1"></textarea>
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImageSrc" src="" alt="UPLOADED" />
                        <button class="remove-image" id="removeImageBtn">✕</button>
                    </div>
                    <button class="add-btn" id="addBtn">+</button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <div class="dropdown-item" data-mode="text">💬 TEXT</div>
                        <div class="dropdown-item" data-mode="image">🖼️ IMAGE</div>
                        <div class="dropdown-item" data-mode="video">🎬 VIDEO</div>
                        <div class="dropdown-item" data-mode="voice">🎤 VOICE</div>
                    </div>
                    <div class="recording-indicator" id="recordingIndicator">🔴 RECORDING...</div>
                    <button class="stop-recording-btn" id="stopRecordingBtn">⏹️ STOP</button>
                </div>
                <button class="generate-btn" id="generateBtn">
                    <span class="btn-text">GENERATE</span>
                    <span class="btn-loader"></span>
                </button>
            </div>
        </div>

        <div class="error" id="error"></div>
        <div class="result-area" id="resultArea">
            <div class="placeholder">
                <span class="icon">✨</span>
                YOUR CREATION WILL APPEAR HERE
            </div>
        </div>
        <div class="action-bar" id="actionBar" style="display:none;">
            <button class="action-btn" id="previewBtn">👁️ PREVIEW</button>
            <button class="action-btn primary" id="downloadBtn">⬇️ DOWNLOAD</button>
            <button class="action-btn" id="editBtn">✏️ EDIT</button>
            <button class="action-btn" id="copyBtn">📋 COPY</button>
        </div>
        <div class="modal-overlay" id="previewModal">
            <div class="modal-content">
                <button class="modal-close" id="closeModal">✕</button>
                <img id="previewImageModal" src="" alt="PREVIEW" />
            </div>
        </div>
    </div>

    <script>
        let currentImageUrl = null, currentType = 'image', currentTextResponse = null, selectedMode = 'text';
        let mediaRecorder = null, audioChunks = [], isRecording = false, uploadedImageData = null;

        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultArea = document.getElementById('resultArea');
        const errorDiv = document.getElementById('error');
        const actionBar = document.getElementById('actionBar');
        const previewBtn = document.getElementById('previewBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const editBtn = document.getElementById('editBtn');
        const copyBtn = document.getElementById('copyBtn');
        const previewModal = document.getElementById('previewModal');
        const previewImageModal = document.getElementById('previewImageModal');
        const closeModal = document.getElementById('closeModal');
        const addBtn = document.getElementById('addBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const stopRecordingBtn = document.getElementById('stopRecordingBtn');
        const imagePreview = document.getElementById('imagePreview');
        const previewImageSrc = document.getElementById('previewImageSrc');
        const removeImageBtn = document.getElementById('removeImageBtn');

        addBtn.addEventListener('click', e => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); });
        document.addEventListener('click', () => dropdownMenu.classList.remove('active'));

        removeImageBtn.addEventListener('click', e => {
            e.stopPropagation();
            uploadedImageData = null;
            imagePreview.classList.remove('active');
            previewImageSrc.src = '';
        });

        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                const mode = this.dataset.mode;
                selectedMode = mode;
                dropdownMenu.classList.remove('active');
                if (mode === 'image' || mode === 'video') {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = mode === 'image' ? 'image/*' : 'video/*';
                    input.onchange = function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                uploadedImageData = ev.target.result;
                                previewImageSrc.src = uploadedImageData;
                                imagePreview.classList.add('active');
                                errorDiv.style.display = 'none';
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    input.click();
                } else if (mode === 'voice') {
                    startVoiceRecording();
                }
            });
        });

        async function startVoiceRecording() {
            if (isRecording) { stopVoiceRecording(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    recordingIndicator.classList.remove('active');
                    stopRecordingBtn.classList.remove('active');
                    isRecording = false;
                    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                        const recognition = new SpeechRecognition();
                        recognition.lang = 'en-US';
                        recognition.onresult = function(event) {
                            const transcript = event.results[0][0].transcript;
                            promptInput.value = transcript.toUpperCase();
                            autoAdjustHeight();
                            setTimeout(() => generate(), 300);
                        };
                        recognition.start();
                    }
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                recordingIndicator.classList.add('active');
                stopRecordingBtn.classList.add('active');
            } catch (err) {
                errorDiv.textContent = '⚠️ MICROPHONE ACCESS DENIED.';
                errorDiv.style.display = 'block';
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            isRecording = false;
            recordingIndicator.classList.remove('active');
            stopRecordingBtn.classList.remove('active');
        }

        stopRecordingBtn.addEventListener('click', e => { e.stopPropagation(); stopVoiceRecording(); });

        function autoAdjustHeight() {
            promptInput.style.height = 'auto';
            promptInput.style.height = Math.min(promptInput.scrollHeight, 500) + 'px';
        }
        promptInput.addEventListener('input', autoAdjustHeight);
        promptInput.addEventListener('focus', autoAdjustHeight);
        promptInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); } });

        function displayResult(type, data) {
            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-result';
            closeBtn.innerHTML = '✕';
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                resultArea.innerHTML = `<div class="placeholder"><span class="icon">✨</span>YOUR CREATION WILL APPEAR HERE</div>`;
                actionBar.style.display = 'none';
                currentImageUrl = null;
                currentTextResponse = null;
            });
            resultArea.innerHTML = '';
            if (type === 'text') {
                const wrapper = document.createElement('div');
                wrapper.className = 'text-response';
                const label = document.createElement('div');
                label.className = 'response-label';
                label.textContent = '💬 AI RESPONSE';
                wrapper.appendChild(label);
                const content = document.createElement('div');
                content.innerHTML = data;
                wrapper.appendChild(content);
                wrapper.appendChild(closeBtn);
                resultArea.appendChild(wrapper);
                currentTextResponse = data;
                currentType = 'text';
                actionBar.style.display = 'flex';
                previewBtn.style.display = 'none';
                downloadBtn.style.display = 'none';
                editBtn.style.display = 'none';
                copyBtn.style.display = 'inline-flex';
            } else {
                const wrapper = document.createElement('div');
                wrapper.className = 'result-wrapper';
                if (type === 'image') {
                    const img = document.createElement('img');
                    img.src = data;
                    img.alt = 'GENERATED IMAGE';
                    img.onerror = function() { this.alt = 'IMAGE LOAD FAILED'; this.style.border = '2px solid #ef4444'; };
                    wrapper.appendChild(img);
                } else {
                    const video = document.createElement('video');
                    video.controls = true;
                    video.autoplay = true;
                    video.loop = true;
                    const source = document.createElement('source');
                    source.src = data;
                    source.type = 'video/mp4';
                    video.appendChild(source);
                    video.innerHTML = 'YOUR BROWSER DOES NOT SUPPORT VIDEO PLAYBACK.';
                    wrapper.appendChild(video);
                }
                wrapper.appendChild(closeBtn);
                resultArea.appendChild(wrapper);
                currentImageUrl = data;
                currentType = type;
                currentTextResponse = null;
                actionBar.style.display = 'flex';
                previewBtn.style.display = 'inline-flex';
                downloadBtn.style.display = 'inline-flex';
                editBtn.style.display = 'inline-flex';
                copyBtn.style.display = 'none';
            }
            errorDiv.style.display = 'none';
        }

        async function generate() {
            const prompt = promptInput.value.trim();
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            if (!prompt) {
                errorDiv.textContent = '⚠️ PLEASE ENTER A PROMPT OR QUESTION';
                errorDiv.style.display = 'block';
                return;
            }
            generateBtn.classList.add('loading');
            resultArea.innerHTML = '<div class="placeholder"><span class="icon">⏳</span>GENERATING...</div>';
            actionBar.style.display = 'none';
            try {
                const requestBody = { prompt, mode: selectedMode };
                if (uploadedImageData) { requestBody.image = uploadedImageData; }
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'SOMETHING WENT WRONG');
                if (data.type === 'text') {
                    displayResult('text', data.text || 'No response received.');
                } else {
                    displayResult(data.type, data.url);
                }
            } catch (err) {
                errorDiv.textContent = '❌ ' + err.message;
                errorDiv.style.display = 'block';
                resultArea.innerHTML = '<div class="placeholder"><span class="icon">❌</span>GENERATION FAILED. PLEASE TRY AGAIN.</div>';
                actionBar.style.display = 'none';
            } finally {
                generateBtn.classList.remove('loading');
            }
        }

        generateBtn.addEventListener('click', generate);

        editBtn.addEventListener('click', function() {
            if (currentImageUrl) {
                uploadedImageData = currentImageUrl;
                previewImageSrc.src = currentImageUrl;
                imagePreview.classList.add('active');
                resultArea.innerHTML = `<div class="placeholder"><span class="icon">✏️</span>IMAGE SENT FOR EDITING</div>`;
                actionBar.style.display = 'none';
                promptInput.focus();
            }
        });

        copyBtn.addEventListener('click', function() {
            if (currentTextResponse) {
                const text = currentTextResponse.replace(/<[^>]*>/g, '');
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.textContent = '✅ COPIED';
                    setTimeout(() => copyBtn.innerHTML = '📋 COPY', 2000);
                });
            }
        });

        previewBtn.addEventListener('click', function() {
            if (currentImageUrl) {
                previewImageModal.src = currentImageUrl;
                previewModal.classList.add('active');
            }
        });
        closeModal.addEventListener('click', () => previewModal.classList.remove('active'));
        previewModal.addEventListener('click', e => { if (e.target === this) previewModal.classList.remove('active'); });

        downloadBtn.addEventListener('click', function() {
            if (currentImageUrl) {
                const link = document.createElement('a');
                link.href = currentImageUrl;
                link.download = `FIXORIUM_${Date.now()}.${currentType === 'image' ? 'jpg' : 'mp4'}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });

        document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); generate(); } });
    </script>
</body>
</html>
